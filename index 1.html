<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boramtek – Coolant Oil Condition Report</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--navy:#1f4e78;--navy2:#163a5a;--org:#c55a11;
--red:#dc2626;--redbg:#fee2e2;--redtx:#991b1b;--yel:#f59e0b;--yelbg:#fef3c7;--yeltx:#92400e;--grn:#15803d;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,var(--navy2),var(--navy));color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{margin:0;font-size:19px;font-weight:700}
header .sub{opacity:.85;font-size:12.5px;margin-top:3px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.pri{background:#fff;color:var(--navy);border-color:#fff}
.btn.pdf{background:var(--org);border-color:var(--org)}.btn.pdf:hover{background:#a84a0e}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;padding:8px 12px;cursor:pointer;font-weight:800;font-family:inherit;font-size:13px}
.lang button.on{background:#fff;color:var(--navy)}
select.hs{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:7px 8px;font-size:13px;max-width:230px}
select.hs option{color:#000}
main{max-width:1500px;margin:0 auto;padding:18px 20px 40px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.sec h2{margin:0 0 12px;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;background:#e8f0f8;color:var(--navy);padding:2px 8px;border-radius:999px}
.exec{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
.headline{border-left:6px solid var(--red);background:linear-gradient(90deg,#fff5f5,#fff);padding:14px 16px;border-radius:10px}
.headline.ok{border-color:var(--grn);background:linear-gradient(90deg,#f0fdf4,#fff)}
.headline .t{font-size:18px;font-weight:700;line-height:1.35}
.headline ul{margin:10px 0 0;padding-left:18px;line-height:1.6}
.headline li b{color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;cursor:pointer;border:1px solid #fca5a5;background:var(--redbg);color:var(--redtx)}
.chip.yellow{border-color:#fcd34d;background:var(--yelbg);color:var(--yeltx)}
.decide{background:#f8fafc;border:1px dashed #94a3b8;border-radius:10px;padding:14px 16px}
.decide h3{margin:0 0 8px;font-size:14px;color:var(--org)}
.decide ol{margin:0;padding-left:18px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.kpi.click{cursor:pointer}.kpi.click:hover{box-shadow:0 4px 14px rgba(15,23,42,.08)}
.kpi.active{outline:3px solid var(--blue)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--navy)}
.kpi.red::before{background:var(--red)}.kpi.yellow::before{background:var(--yel)}.kpi.white::before{background:#cbd5e1}.kpi.act::before{background:var(--org)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px;line-height:1.1}
.kpi.red .v{color:var(--red)}.kpi.yellow .v{color:#b45309}.kpi.act .v{color:var(--org)}
.kpi .d{font-size:12px;margin-top:4px;color:var(--mut)}
.up{color:var(--red);font-weight:700}.down{color:var(--grn);font-weight:700}
.bar{height:6px;border-radius:4px;background:#eef2f7;margin-top:8px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:3px;border:1px solid #94a3b8}
.dot.red{background:var(--red);border-color:var(--red)}.dot.yellow{background:var(--yel);border-color:var(--yel)}.dot.white{background:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.filters label{font-size:12px;color:var(--mut);font-weight:600;display:flex;flex-direction:column;gap:3px}
.filters select,.filters input{border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-size:13px;min-width:150px;background:#fff;font-family:inherit}
.filters input[type=search]{min-width:220px}
.btn2{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--navy);font-family:inherit}
.btn2:hover{background:#f1f5f9}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:12px;border-radius:3px;border:1px solid #cbd5e1;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid.one{grid-template-columns:1fr}.grid.one .cc svg{max-width:1000px;margin:4px auto 0}
.pgrp{display:contents}
.cc{border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;background:#fff;break-inside:avoid}
.cc.red{border-color:#fca5a5;box-shadow:inset 0 3px 0 var(--red)}.cc.yellow{border-color:#fcd34d;box-shadow:inset 0 3px 0 var(--yel)}
.cc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc .code{font-size:16px;font-weight:800;color:var(--navy)}
.cc .meta{font-size:12px;color:var(--mut);margin-top:2px}
.stbox{min-width:160px;text-align:right;border-radius:10px;padding:6px 10px;border:1px solid #cbd5e1;background:#fff}
.stbox .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700}
.stbox .s{font-size:14px;font-weight:800}.stbox .x{font-size:11px;color:var(--mut)}
.stbox.red{background:var(--redbg);border-color:#fca5a5}.stbox.red .s{color:var(--redtx)}
.stbox.yellow{background:var(--yelbg);border-color:#fcd34d}.stbox.yellow .s{color:var(--yeltx)}
.stbox.white .s{color:var(--grn)}
.cc svg{width:100%;height:auto;display:block;margin-top:4px}
.cc .note{font-size:12px;color:#334155;border-top:1px dashed var(--line);padding-top:6px;line-height:1.45}
.cc .note b{color:var(--navy)}
.adate{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#e8f0f8;color:var(--navy);white-space:nowrap}
.adate.new{background:#fde7d7;color:#9a3c0b}
.empty{padding:30px;text-align:center;color:var(--mut)}
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:8px;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th:hover{background:var(--navy2)}th .ar{opacity:.6;font-size:10px;margin-left:3px}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.red td{background:#fff1f1}tr.yellow td{background:#fffbeb}
tr.wsrow td{background:#dbe7f3;color:var(--navy);font-weight:800;font-size:13px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:var(--grn)}
.pill.red{background:var(--redbg);color:var(--redtx);border-color:#fca5a5}.pill.yellow{background:var(--yelbg);color:var(--yeltx);border-color:#fcd34d}
.cell-red{color:var(--red);font-weight:700}.cell-yel{color:#b45309;font-weight:700}
td.txt{min-width:220px;max-width:380px}
.lnk{color:var(--blue);cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:50;max-width:90vw}
.loading{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:40;color:#fff;font-weight:700;font-size:16px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:10px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:500px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 4px;color:var(--navy);font-size:17px}
.mbox .hint{font-size:12.5px;color:var(--mut);margin:0 0 12px;line-height:1.5}
.mbox fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 12px}
.mbox legend{font-size:12px;font-weight:700;color:var(--mut);padding:0 4px}
.mbox label{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:4px 0;cursor:pointer}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.mact .go{background:var(--org);color:#fff;border-color:var(--org)}
.ponly{display:none}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:900px){.exec,.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@page{size:A4 landscape;margin:8mm 9mm 9mm}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff;font-size:11px}
  header{position:static;box-shadow:none;padding:8px 12px;border-radius:8px}
  header h1{font-size:16px}
  header .hbtns,.filters,.modal,.toast,.loading,#countInfo,.sortHintTag{display:none!important}
  main{max-width:none;padding:6px 0 0}
  .ponly{display:block}
  .pmeta{font-size:10.5px;color:#334155;margin:6px 2px 8px}
  .sec{border-radius:8px;padding:10px 12px;margin-bottom:10px;border:0;padding:0}
  .exec{grid-template-columns:1.4fr 1fr;gap:10px}
  .headline .t{font-size:14px}
  .kpis{grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:10px}
  .kpi{padding:7px 9px}.kpi .v{font-size:20px}.kpi .l{font-size:9px}.kpi .d{font-size:9.5px}
  .kpi.active{outline:none}
  body.p-nosum #secExec,body.p-nosum #kpis{display:none}
  body.p-nosum header{display:none}
  body.p-nocharts #secCharts{display:none}
  body.p-notable #secTable{display:none}
  body:not(.p-nosum) #secCharts{break-before:page}
  body:not(.p-nocharts) #secTable{break-before:page}
  #secCharts h2{margin-bottom:4px;font-size:13px}
  .legend{font-size:9.5px;margin-bottom:4px}
  .grid,.grid.one{display:block}
  .pgrp{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:6px;break-after:page;break-inside:avoid}
  .pgrp:last-child{break-after:auto}
  .cc{padding:5px 8px;box-shadow:none!important;border-width:1.3px;border-radius:8px;overflow:hidden;height:84mm;display:flex;flex-direction:column}
  .cc.red{border-top:4px solid var(--red)}.cc.yellow{border-top:4px solid var(--yel)}
  .cc svg{flex:0 0 auto;max-height:47mm}
  .cc .meta{font-size:8.5px}.cc .code{font-size:12.5px}
  .stbox{padding:2px 6px;min-width:110px}.stbox .s{font-size:11px}.stbox .x{font-size:8px}.stbox .k{font-size:8px}
  .cc .note{font-size:8.3px;line-height:1.3;flex:1 1 auto;overflow:hidden}
  .tw{max-height:none;overflow:visible;border:0}
  table{font-size:9px}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  th{position:static;padding:4px}th .ar{display:none}
  td{padding:3px 4px}
  td.txt{min-width:0;max-width:none}
  .lnk{color:inherit}
}
</style>
</head>
<body>
<header>
  <div><h1 data-i="title"></h1><div class="sub" id="subTitle"></div></div>
  <div class="hbtns">
    <div class="lang" role="group" aria-label="Language"><button type="button" id="lVN" class="on">VN</button><button type="button" id="lEN">EN</button></div>
    <select class="hs" id="sheetSel" style="display:none" aria-label="Sheet"></select>
    <input type="file" id="fileIn" accept=".xlsx,.xlsm" style="display:none">
    <button class="btn pri" id="btnUp" type="button" data-i="upload"></button>
    <button class="btn" id="btnTpl" type="button" data-i="template"></button>
    <button class="btn pdf" id="btnPrint" type="button" data-i="print"></button>
  </div>
</header>
<main>
  <div class="ponly pmeta" id="pmeta"></div>
  <section class="sec" id="secExec">
    <h2><span data-i="sec1"></span> <span class="tag" id="roundTag"></span></h2>
    <div class="exec"><div class="headline" id="headline"></div><div class="decide" id="decide"></div></div>
  </section>
  <div class="kpis" id="kpis"></div>
  <section class="sec" id="secCharts">
    <h2><span data-i="sec2"></span> <span class="tag" id="fromTag"></span></h2>
    <div class="filters">
      <label><span data-i="fMachine"></span><select id="fMachine"></select></label>
      <label><span data-i="fWs"></span><select id="fWs"></select></label>
      <label><span data-i="fSt"></span><select id="fSt"></select></label>
      <label><span data-i="fAct"></span><select id="fAct"></select></label>
      <label><span data-i="fSort"></span><select id="fSort"></select></label>
      <label><span data-i="fSearch"></span><input type="search" id="fQ"></label>
      <button class="btn2" id="fReset" type="button" data-i="reset"></button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="countInfo" style="font-size:12px;color:var(--mut);margin-bottom:8px"></div>
    <div class="grid" id="charts"></div>
  </section>
  <section class="sec" id="secTable">
    <h2><span data-i="sec3"></span> <span class="tag sortHintTag" data-i="sortHint"></span> <span class="tag" id="tblTag"></span></h2>
    <div class="tw"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </section>
  <footer id="foot"></footer>
</main>
<div class="modal" id="pdfModal" role="dialog" aria-modal="true" aria-labelledby="pdfTitle">
  <div class="mbox">
    <h3 id="pdfTitle" data-i="pdfTitle"></h3>
    <p class="hint" data-i="pdfHint"></p>
    <fieldset><legend data-i="pdfScope"></legend>
      <label><input type="radio" name="pscope" value="filter" checked> <span data-i="pdfFilter"></span></label>
      <label><input type="radio" name="pscope" value="act"> <span data-i="pdfAct"></span></label>
      <label><input type="radio" name="pscope" value="ry"> <span data-i="pdfRY"></span></label>
      <label><input type="radio" name="pscope" value="all"> <span data-i="pdfAll"></span></label>
    </fieldset>
    <fieldset><legend data-i="pdfOrder"></legend>
      <label><input type="radio" name="porder" value="ord" checked> <span data-i="pdfOrdExcel"></span></label>
      <label><input type="radio" name="porder" value="sev"> <span data-i="pdfOrdSev"></span></label>
    </fieldset>
    <fieldset><legend data-i="pdfParts"></legend>
      <label><input type="checkbox" id="pSum" checked> <span data-i="pdfSum"></span></label>
      <label><input type="checkbox" id="pCharts" checked> <span data-i="pdfCharts"></span></label>
      <label><input type="checkbox" id="pTable" checked> <span data-i="pdfTable"></span></label>
    </fieldset>
    <div class="mact"><button type="button" class="btn2" id="pCancel" data-i="cancel"></button><button type="button" class="btn2 go" id="pGo" data-i="pdfGo"></button></div>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="loading" id="loading" data-i="loading"></div>
<script>
const XL = (() => {
  const td = new TextDecoder('utf-8');
  const u16 = (d, o) => d[o] | (d[o + 1] << 8);
  const u32 = (d, o) => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16)) + d[o + 3] * 16777216;
  async function inflateRaw(u8) { const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return new Uint8Array(await new Response(s).arrayBuffer()); }
  function listEntries(d) {
    let e = -1; for (let i = d.length - 22; i >= Math.max(0, d.length - 70000); i--) { if (d[i] === 0x50 && d[i + 1] === 0x4b && d[i + 2] === 5 && d[i + 3] === 6) { e = i; break; } }
    if (e < 0) throw new Error('Invalid .xlsx');
    const n = u16(d, e + 10); let p = u32(d, e + 16); const out = {};
    for (let i = 0; i < n; i++) { if (u32(d, p) !== 0x02014b50) break;
      const method = u16(d, p + 10), csize = u32(d, p + 20), nl = u16(d, p + 28), xl = u16(d, p + 30), cl = u16(d, p + 32), lho = u32(d, p + 42);
      out[td.decode(d.subarray(p + 46, p + 46 + nl))] = { method, csize, lho }; p += 46 + nl + xl + cl; }
    return out;
  }
  async function readEntry(d, e) { const p = e.lho, st = p + 30 + u16(d, p + 26) + u16(d, p + 28), raw = d.subarray(st, st + e.csize); return td.decode(e.method === 0 ? raw : await inflateRaw(raw)); }
  const dec = s => s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-fA-F]+);/g, (m, g) => g === 'lt' ? '<' : g === 'gt' ? '>' : g === 'amp' ? '&' : g === 'quot' ? '"' : g === 'apos' ? "'" : g[1] === 'x' ? String.fromCodePoint(parseInt(g.slice(2), 16)) : String.fromCodePoint(parseInt(g.slice(1), 10)));
  const attr = (s, n) => { const m = new RegExp('\\b' + n + '="([^"]*)"').exec(s); return m ? dec(m[1]) : null; };
  const colIdx = ref => { let n = 0; for (const ch of /^([A-Z]+)/.exec(ref)[1]) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const textOf = xml => { let o = ''; xml.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (m, t) => { o += dec(t); return m; }); return o; };
  async function open(buf) {
    const d = new Uint8Array(buf), ents = listEntries(d), get = async n => ents[n] ? readEntry(d, ents[n]) : null;
    const wb = await get('xl/workbook.xml'); if (!wb) throw new Error('No workbook.xml');
    const rels = (await get('xl/_rels/workbook.xml.rels')) || '', relMap = {};
    rels.replace(/<Relationship\b([^>]*)\/?>/g, (m, a) => { relMap[attr(a, 'Id')] = attr(a, 'Target'); return m; });
    const sheets = []; wb.replace(/<sheet\b([^>]*)\/?>/g, (m, a) => { let t = (relMap[attr(a, 'r:id')] || '').replace(/^\/?xl\//, '').replace(/^\//, ''); sheets.push({ name: attr(a, 'name'), path: 'xl/' + t }); return m; });
    const ssx = await get('xl/sharedStrings.xml'), ss = [];
    if (ssx) ssx.replace(/<si\b[^>]*>([\s\S]*?)<\/si>|<si\b[^>]*\/>/g, (m, i) => { ss.push(i ? textOf(i) : ''); return m; });
    async function readSheet(name) {
      const sh = sheets.find(s => s.name === name); if (!sh) throw new Error('No sheet ' + name);
      const x = await get(sh.path), rows = [], sd = /<sheetData\b[^>]*>([\s\S]*)<\/sheetData>/.exec(x || '');
      (sd ? sd[1] : '').replace(/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g, (rm, ra, rb) => {
        const r = parseInt(attr(ra, 'r'), 10) - 1, arr = [];
        if (rb) rb.replace(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, (cm, ca, cb) => {
          const ref = attr(ca, 'r'), t = attr(ca, 't'); if (!ref || !cb) return cm;
          let v = null; const vm = /<v>([\s\S]*?)<\/v>/.exec(cb);
          if (t === 's') v = vm ? ss[parseInt(vm[1], 10)] : null; else if (t === 'inlineStr') v = textOf(cb);
          else if (t === 'str' || t === 'e') v = vm ? dec(vm[1]) : null; else if (t === 'b') v = vm ? vm[1] === '1' : null;
          else if (vm) { const n = parseFloat(vm[1]); v = isNaN(n) ? dec(vm[1]) : n; }
          if (v !== null && v !== '') arr[colIdx(ref)] = v; return cm; });

      if (m.actionDate && m.actionDate === d.key) s += `<rect x="${x(i) - 14}" y="${pt}" width="28" height="${ph}" fill="#fde7d7" opacity=".6"><title>${esc(T('done') + ' ' + d.key)}</title></rect>`;
      s += `<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt + ph}" stroke="#e2e8f0" stroke-width=".6"/>`;
      s += `<text x="${x(i)}" y="${pt + ph + 14}" font-size="10" text-anchor="middle" fill="${d.key === LAST ? '#c55a11' : '#334155'}" font-weight="${d.key === LAST ? 700 : 400}">${esc(lbl)}</text>`;
      if (p.tramp >= 1) tags.push(`<tspan fill="${p.tramp === 2 ? '#dc2626' : '#b45309'}">T${p.tramp}</tspan>`);
      if (p.odor === 1) tags.push(`<tspan fill="#dc2626">M</tspan>`);
      if (isS && p.status) s += `<rect x="${x(i) - 12}" y="${pt + ph + 20}" width="24" height="9" rx="3" fill="${p.status === 'red' ? '#dc2626' : p.status === 'yellow' ? '#f59e0b' : '#fff'}" stroke="${p.status === 'white' ? '#94a3b8' : 'none'}"><title>${esc(T('status') + ' ' + d.key + ': ' + SL(p.status))}</title></rect>`;
      if (tags.length) s += `<text x="${x(i)}" y="${pt + ph + 41}" font-size="9.5" font-weight="700" text-anchor="middle">${tags.join(' ')}</text>`;
      if (p.na && p.brix == null) s += `<text x="${x(i)}" y="${pt + ph - 6}" font-size="9" text-anchor="middle" fill="#64748b" font-weight="700">${esc(String(p.na).toUpperCase().slice(0, 8))}</text>`;
    });
    s += `<text x="${pl - 5}" y="${pt + ph + 28}" font-size="8.5" text-anchor="end" fill="#64748b">TT</text>`;
    const pts = []; dates.forEach((d, i) => { const p = m.series[d.key]; if (p && p.brix != null) pts.push([x(i), y(p.brix), p, d]); });
    if (pts.length > 1) s += `<polyline points="${pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}" fill="none" stroke="#1f4e78" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(([px, py, p, d]) => {
      const b = band(p.brix), fill = b === 'red' ? '#dc2626' : b === 'yellow' ? '#f59e0b' : '#ffffff';
      const tip = `${d.key}\nBrix: ${p.brixRaw}\npH: ${p.ph != null ? (p.phRaw || fmt(p.ph)) : '–'}${p.tramp != null ? '\nTramp oil: ' + p.tramp : ''}${p.odor != null ? '\n' + (LANG === 'vi' ? 'Mùi' : 'Odor') + ': ' + p.odor : ''}${p.status ? '\n' + T('status') + ': ' + SL(p.status) : ''}`;
      s += `<g><title>${esc(tip)}</title><circle cx="${px}" cy="${py}" r="${d.key === LAST ? 5.5 : 4.5}" fill="${fill}" stroke="#1f4e78" stroke-width="1.6"/>`;
      const ly = Math.max(py - 9, pt + 20);
      s += `<text x="${px}" y="${ly}" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(p.brixApprox ? String(p.brixRaw).replace(/\s/g, '') : fmt(p.brix))}</text>`;
      if (p.ph != null) s += `<text x="${px}" y="${ly - 12}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${p.ph < 8.5 ? '#dc2626' : '#6d28d9'}" paint-order="stroke" stroke="#fff" stroke-width="3">pH ${esc(fmt(p.ph))}</text>`;
      else if (d.key === LAST) s += `<text x="${px}" y="${ly - 12}" font-size="9" font-weight="700" text-anchor="middle" fill="#94a3b8" paint-order="stroke" stroke="#fff" stroke-width="3">pH –</text>`;
      s += '</g>';
    });
    dates.forEach((d, i) => { const p = m.series[d.key]; if (p && p.brix == null && p.ph != null) s += `<text x="${x(i)}" y="${pt + 12}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6d28d9">pH ${esc(fmt(p.ph))}</text>`; });
    return s + '</svg>';
  }

  function matchAct(m) {
    if (!st.act) return true;
    if (st.act === 'latest') return !!LACT && m.actionDate === LACT;
    if (st.act === 'none') return !m.actionDate;
    return m.actionDate === st.act;
  }
  function filtered() {
    if (printOverride) return printOverride;
    const q = norm(st.q).trim();
    return M.filter(m => {
      if (st.machine && m.code !== st.machine) return false; if (st.ws && m.ws !== st.ws) return false;
      if (st.status === 'ry' ? !(m.status === 'red' || m.status === 'yellow') : (st.status && m.status !== st.status)) return false;
      if (!matchAct(m)) return false;
      if (q) { const hay = norm([m.code, m.ws, I18N.vi['st_' + (m.status || 'none')], I18N.en['st_' + (m.status || 'none')], m.action, m.plan, issues(m).join(' ')].join(' ')); if (!q.split(/\s+/).every(t => hay.includes(t))) return false; }
      return true;
    });
  }
  const lb = m => m.lm && m.lm.brix != null ? m.lm.brix : null, lp = m => m.lm && m.lm.ph != null ? m.lm.ph : null, nn = (v, d) => v == null ? d : v;
  function sortCards(arr) {
    const f = { sev: (a, b) => b.sev - a.sev || b.trend - a.trend || a.ord - b.ord, ord: (a, b) => a.ord - b.ord, code: (a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }),
      brixD: (a, b) => nn(lb(b), -1) - nn(lb(a), -1), brixA: (a, b) => nn(lb(a), 999) - nn(lb(b), 999), phA: (a, b) => nn(lp(a), 99) - nn(lp(b), 99), trend: (a, b) => b.trend - a.trend || b.sev - a.sev,
      act: (a, b) => (b.actionSort || 0) - (a.actionSort || 0) || b.sev - a.sev || a.ord - b.ord }[st.sort] || ((a, b) => a.ord - b.ord);
    return arr.slice().sort(f);
  }
  const adPill = m => m.actionDate ? `<span class="adate${m.actionDate === LACT ? ' new' : ''}">${esc(m.actionDate)}</span>` : `<span style="color:var(--mut)">–</span>`;
  function card(m) {
    const s = m.status || 'none', iss = issues(m), tr = m.trend > 0 ? `<span class="up">${T('worse')}</span>` : m.trend < 0 ? `<span class="down">${T('better')}</span>` : (m.prevSt ? T('unchanged') : '');
    return `<div class="cc ${s}"><div class="top"><div><div class="code">${esc(m.code)} <span style="font-size:11px;color:var(--mut);font-weight:600">#${esc(m.no)}</span></div>
      <div class="meta">${esc(m.ws)} · ${T('lastMeas', { d: esc(m.lmDate || '–'), b: m.lm && m.lm.brix != null ? fmt(m.lm.brix) + '%' : '–', p: m.lm && m.lm.ph != null ? fmt(m.lm.ph) : '–' })}${iss.length ? ' · <span class="cell-red">' + esc(iss.join(', ')) + '</span>' : ''}</div></div>
      <div class="stbox ${s}"><div class="k">${esc(T('oil'))}</div><div class="s">${m.status ? DOT(m.status) + ' ' : ''}${esc(SL(m.status))}</div><div class="x">${esc(m.statusDate || '')}${m.statusSrc === 'calc' ? ' ' + esc(T('calc')) : ''}${m.prevSt ? ' · ' + esc(T('prevSt', { s: SL(m.prevSt) })) : ''} ${tr}</div></div></div>
      ${chartSvg(m)}
      <div class="note"><b>${esc(T('done'))}</b> ${m.actionDate ? adPill(m) + ' ' + esc(m.actionText) : esc(m.actionText || T('noAct'))}${m.plan ? `<br><b>${esc(T('plan'))}</b> ${esc(m.plan)}` : ''}</div></div>`;
  }
  function renderCharts(list) {
    const arr = sortCards(list), g = $('charts'); g.className = 'grid' + (arr.length === 1 ? ' one' : '');
    $('countInfo').textContent = T('count', { n: arr.length, t: M.length });
    if (!arr.length) { g.innerHTML = `<div class="empty">${esc(T('none'))}</div>`; return; }
    if (PRINTING) { let h = ''; for (let i = 0; i < arr.length; i += 4) h += `<div class="pgrp">${arr.slice(i, i + 4).map(card).join('')}</div>`; g.innerHTML = h; }
    else g.innerHTML = arr.map(card).join('');
  }

  const COLS = [
    { k: 'no', v: m => m.ord, num: 1, h: m => esc(m.no) }, { k: 'ws', v: m => m.ws }, { k: 'code', v: m => m.code, h: m => `<span class="lnk" data-code="${esc(m.code)}">${esc(m.code)}</span>` },
    { k: 'sev', v: m => m.sev, h: m => `<span class="pill ${m.status || ''}">${m.status ? DOT(m.status) : ''}${esc(SL(m.status))}</span>` },
    { k: 'prev', v: m => m.prevSt ? SEV[m.prevSt] : 0, h: m => m.prevSt ? `<span class="pill ${m.prevSt}">${esc(SL(m.prevSt))}</span>` : '–' },
    { k: 'trend', v: m => m.trend, h: m => m.trend > 0 ? `<span class="up">${T('tWorse')}</span>` : m.trend < 0 ? `<span class="down">${T('tBetter')}</span>` : (m.prevSt ? '=' : '–') },
    { k: 'brix', v: lb, num: 1, h: m => { const b = lb(m), c = band(b); return b == null ? '–' : `<span class="${c === 'red' ? 'cell-red' : c === 'yellow' ? 'cell-yel' : ''}">${fmt(b)}</span>`; } },
    { k: 'ph', v: lp, num: 1, h: m => { const p = lp(m); return p == null ? '–' : `<span class="${p < 8.5 ? 'cell-red' : p < 9 ? 'cell-yel' : ''}">${fmt(p)}</span>`; } },
    { k: 'tramp', v: m => m.lt ? m.lt.tramp : null, num: 1, h: m => m.lt && m.lt.tramp != null ? `<span class="${m.lt.tramp === 2 ? 'cell-red' : m.lt.tramp === 1 ? 'cell-yel' : ''}">${m.lt.tramp}</span>` : '–' },
    { k: 'odor', v: m => m.lt ? m.lt.odor : null, num: 1, h: m => m.lt && m.lt.odor != null ? `<span class="${m.lt.odor === 1 ? 'cell-red' : ''}">${m.lt.odor}</span>` : '–' },
    { k: 'lmd', v: m => { const d = D.dates.find(x => x.key === m.lmDate); return d ? d.sort : 0; }, h: m => esc(m.lmDate || '–') + (LAST && !m.measuredLast ? ` <span class="cell-yel" title="${esc(T('notMeasTip'))}">•</span>` : '') },
    { k: 'ad', v: m => m.actionSort || 0, h: adPill },
    { k: 'action', v: m => m.actionText, txt: 1 }, { k: 'plan', v: m => m.plan, txt: 1 }
  ];
  function renderTable(list) {
    const { k, dir } = st.tSort, col = COLS.find(c => c.k === k) || COLS[3];
    const arr = list.slice().sort((a, b) => { const va = col.v(a), vb = col.v(b); if (va == null || va === '') return 1; if (vb == null || vb === '') return -1;
      const r = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), undefined, { numeric: true }); return r * dir || (b.sev - a.sev) || (a.ord - b.ord); });
    $('tblTag').textContent = T('tblTag', { n: arr.length });
    $('tbl').tHead.innerHTML = '<tr>' + COLS.map(c => `<th data-k="${c.k}">${esc(T('c_' + c.k))}<span class="ar">${c.k === k ? (dir > 0 ? '▲' : '▼') : '⇅'}</span></th>`).join('') + '</tr>';
    const grouped = k === 'no' && dir > 0; let curWs = null, html = '';
    arr.forEach(m => {
      if (grouped && m.ws !== curWs) { curWs = m.ws; const n = arr.filter(x => x.ws === curWs).length; html += `<tr class="wsrow"><td colspan="${COLS.length}">${esc(curWs || '—')} · ${esc(T('tblTag', { n }))}</td></tr>`; }
      html += `<tr class="${m.status || ''}">` + COLS.map(c => `<td class="${c.num ? 'num' : ''}${c.txt ? ' txt' : ''}">${c.h ? c.h(m) : esc(c.v(m))}</td>`).join('') + '</tr>';
    });
    $('tbl').tBodies[0].innerHTML = html || `<tr><td colspan="${COLS.length}" class="empty">${esc(T('none'))}</td></tr>`;
    $('tbl').tHead.querySelectorAll('th').forEach(th => th.addEventListener('click', () => { const kk = th.dataset.k; st.tSort = { k: kk, dir: st.tSort.k === kk ? -st.tSort.dir : (['code', 'ws', 'action', 'plan', 'no'].includes(kk) ? 1 : -1) }; renderTable(filtered()); }));
    $('tbl').tBodies[0].querySelectorAll('.lnk').forEach(a => a.addEventListener('click', () => { st.machine = a.dataset.code; syncFilters(); renderAll(); $('charts').scrollIntoView({ behavior: 'smooth' }); }));
  }

  function buildFilters() {
    const codes = M.slice().sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    $('fMachine').innerHTML = `<option value="">${esc(T('allM', { n: M.length }))}</option>` + codes.map(m => `<option value="${esc(m.code)}">${m.status ? '● ' : ''}${esc(m.code)}${m.status ? ' – ' + esc(SL(m.status)) : ''}</option>`).join('');
    const wss = [...new Set(M.map(m => m.ws).filter(Boolean))];
    $('fWs').innerHTML = `<option value="">${esc(T('all'))}</option>` + wss.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
    $('fSt').innerHTML = `<option value="">${esc(T('all'))}</option><option value="red">● ${esc(SL('red'))}</option><option value="yellow">● ${esc(SL('yellow'))}</option><option value="white">○ ${esc(SL('white'))}</option><option value="ry">${esc(T('ry'))}</option>`;
    const ad = {}; M.forEach(m => { if (m.actionDate) { ad[m.actionDate] = ad[m.actionDate] || { n: 0, s: m.actionSort }; ad[m.actionDate].n++; } });
    const adl = Object.entries(ad).sort((a, b) => b[1].s - a[1].s), nNone = M.filter(m => !m.actionDate).length;
    $('fAct').innerHTML = `<option value="">${esc(T('all'))}</option>` + (LACT ? `<option value="latest">${esc(T('actLatest', { d: LACT, n: ad[LACT].n }))}</option>` : '') +
      adl.filter(([k]) => k !== LACT).map(([k, v]) => `<option value="${esc(k)}">${esc(T('actDate', { d: k, n: v.n }))}</option>`).join('') + (nNone ? `<option value="none">${esc(T('actNone', { n: nNone }))}</option>` : '');
    $('fSort').innerHTML = [['sev', 'sSev'], ['ord', 'sOrd'], ['act', 'sAct'], ['code', 'sCode'], ['brixD', 'sBrixD'], ['brixA', 'sBrixA'], ['phA', 'sPhA'], ['trend', 'sTrend']].map(([v, k]) => `<option value="${v}">${esc(T(k))}</option>`).join('');
    syncFilters();
  }
  function syncFilters() { $('fMachine').value = st.machine; $('fWs').value = st.ws; $('fSt').value = st.status; $('fAct').value = st.act; $('fSort').value = st.sort; $('fQ').value = st.q; }
  function applyStatic() {
    document.documentElement.lang = LANG === 'vi' ? 'vi' : 'en';
    document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
    $('fQ').placeholder = T('qPh');
    $('lVN').className = LANG === 'vi' ? 'on' : ''; $('lEN').className = LANG === 'en' ? 'on' : '';
    $('lVN').setAttribute('aria-pressed', LANG === 'vi'); $('lEN').setAttribute('aria-pressed', LANG === 'en');
    $('legend').innerHTML = `<span><i class="sw" style="background:#fff"></i>${esc(T('lgW'))}</span><span><i class="sw" style="background:#fdf0bf"></i>${esc(T('lgY'))}</span><span><i class="sw" style="background:#fbd5d5"></i>${esc(T('lgR'))}</span><span><b style="color:#6d28d9">pH</b> ${esc(T('lgPh'))}</span><span><i class="sw" style="background:#fde7d7"></i>${esc(T('done'))}</span><span>${esc(T('lgT'))}</span>`;
    if (D) { $('subTitle').textContent = T('sub', { src: srcName || T('srcEmbed'), sheet: D.sheet, n: D.machines.length, d: D.dates.length, from: D.dates[0].key, to: D.dates[D.dates.length - 1].key }); $('fromTag').textContent = T('fromTag', { d: CDATES[0].key }); }
    $('foot').textContent = T('foot');
  }
  function renderAll() { renderExec(); const f = filtered(); renderCharts(f); renderTable(f); }
  function setLang(l) { if (LANG === l) return; LANG = l; applyStatic(); buildFilters(); renderAll(); }
  function load(data, src) { srcName = src; prepare(data); st.machine = st.ws = st.status = st.act = st.q = ''; applyStatic(); buildFilters(); renderAll(); }

  /* ---------- PDF ---------- */
  let printScope = 'filter', printOrder = 'ord', savedTitle = document.title, saved = null;
  function openPdf() {
    const ry = M.filter(m => m.status === 'red' || m.status === 'yellow').length;
    const q = k => document.querySelector(`#pdfModal [data-i="${k}"]`);
    q('pdfFilter').textContent = T('pdfFilter', { n: filtered().length });
    q('pdfAct').textContent = T('pdfAct', { d: LACT || '–', n: actM().length });
    q('pdfRY').textContent = T('pdfRY', { n: ry });
    q('pdfAll').textContent = T('pdfAll', { n: M.length });
    $('pdfModal').classList.add('on'); $('pGo').focus();
  }
  function closePdf() { $('pdfModal').classList.remove('on'); }
  function setParts(sum, charts, table) { document.body.classList.toggle('p-nosum', !sum); document.body.classList.toggle('p-nocharts', !charts); document.body.classList.toggle('p-notable', !table); }
  function beforePrint() {
    const sc = printScope;
    printOverride = sc === 'all' ? M.slice() : sc === 'ry' ? M.filter(m => m.status === 'red' || m.status === 'yellow') : sc === 'act' ? actM() : null;
    saved = { sort: st.sort, tSort: st.tSort };
    st.sort = printOrder; st.tSort = printOrder === 'ord' ? { k: 'no', dir: 1 } : { k: 'sev', dir: -1 };
    PRINTING = true;
    const list = filtered(); renderCharts(list); renderTable(list);
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    $('pmeta').textContent = T('pMeta', { d: `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`, s: T('pScope_' + sc, { d: LACT || '–' }) + ' – ' + list.length + '/' + M.length, src: (srcName || T('srcEmbed')) + ' · ' + D.sheet });
    savedTitle = document.title;
    document.title = T('pdfName', { d: String(LAST || '').replace(/[\/&]/g, '-') });
  }
  function afterPrint() {
    if (saved) { st.sort = saved.sort; st.tSort = saved.tSort; saved = null; }
    PRINTING = false; printOverride = null; syncFilters(); const f = filtered(); renderCharts(f); renderTable(f);
    printScope = 'filter'; document.title = savedTitle; setParts(true, true, true);
  }
  window.addEventListener('afterprint', afterPrint);
  $('btnPrint').addEventListener('click', openPdf);
  $('pCancel').addEventListener('click', closePdf);
  $('pdfModal').addEventListener('click', e => { if (e.target === $('pdfModal')) closePdf(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('pdfModal').classList.contains('on')) closePdf(); });
  $('pGo').addEventListener('click', () => {
    printScope = (document.querySelector('input[name="pscope"]:checked') || {}).value || 'filter';
    printOrder = (document.querySelector('input[name="porder"]:checked') || {}).value || 'ord';
    setParts($('pSum').checked, $('pCharts').checked, $('pTable').checked);
    closePdf(); beforePrint(); setTimeout(() => window.print(), 150);
  });

  /* ---------- events ---------- */
  $('lVN').addEventListener('click', () => setLang('vi')); $('lEN').addEventListener('click', () => setLang('en'));
  $('fMachine').addEventListener('change', e => { st.machine = e.target.value; renderAll(); });
  $('fWs').addEventListener('change', e => { st.ws = e.target.value; renderAll(); });
  $('fSt').addEventListener('change', e => { st.status = e.target.value; renderAll(); });
  $('fAct').addEventListener('change', e => { st.act = e.target.value; renderAll(); });
  $('fSort').addEventListener('change', e => { st.sort = e.target.value; if (st.sort === 'ord') { st.tSort = { k: 'no', dir: 1 }; renderTable(filtered()); } renderCharts(filtered()); });
  let qt; $('fQ').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value; renderAll(); }, 200); });
  $('fReset').addEventListener('click', () => { st.machine = st.ws = st.status = st.act = st.q = ''; st.sort = 'sev'; st.tSort = { k: 'sev', dir: -1 }; syncFilters(); renderAll(); });
  $('btnTpl').addEventListener('click', () => {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(TEMPLATE.build()); a.download = 'Template_Theo_doi_dau_tuoi_nguoi.xlsx'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast(T('tplOk')); }
    catch (e) { toast(T('tplErr') + e.message); }
  });
  $('btnUp').addEventListener('click', () => $('fileIn').click());
  async function useSheet(name, fname) { const data = PARSER.parse(await wbRef.readSheet(name), name); load(data, fname); }
  $('fileIn').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return; e.target.value = '';
    if (typeof DecompressionStream === 'undefined') { toast(T('noDS'), 7000); return; }
    $('loading').style.display = 'flex';
    try {
      wbRef = await XL.open(await f.arrayBuffer()); const names = wbRef.sheetNames;
      const pref = names.filter(n => /summary/i.test(n)).concat(names.filter(n => !/summary/i.test(n)));
      let ok = null, err = null; for (const n of pref) { try { await useSheet(n, f.name); ok = n; break; } catch (x) { err = x; } }
      const sel = $('sheetSel'); sel.innerHTML = names.map(n => `<option${n === ok ? ' selected' : ''}>${esc(n)}</option>`).join(''); sel.style.display = ''; sel.dataset.file = f.name;
      if (!ok) throw err || new Error('-');
      toast(T('loaded', { f: f.name, s: ok }));
    } catch (x) { toast(T('loadErr', { e: x.message }), 8000); } finally { $('loading').style.display = 'none'; }
  });
  $('sheetSel').addEventListener('change', async e => {
    $('loading').style.display = 'flex';
    try { await useSheet(e.target.value, e.target.dataset.file); toast(T('switched', { s: e.target.value })); } catch (x) { toast(T('badSheet'), 7000); } finally { $('loading').style.display = 'none'; }
  });
  load(EMBED, '20261112_THEO DÕI NỒNG ĐỘ DẦU NHÀ MÁY BORAMTEK.xlsx');
  window.__test = { beforePrint, afterPrint, cfg: (s, o) => { printScope = s; printOrder = o; }, setParts };
})();

</script>
